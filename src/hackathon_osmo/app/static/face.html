<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/static/face-manifest.json" />
  <title>Osmo · CAD Companion OLED</title>
  <link rel="stylesheet" href="/static/face.css" />
</head>
<body data-mode="dialogue">
  <!-- Subtle architectural edge glow mirroring rear 8-LED HiLight ring -->
  <div id="halo" class="halo"></div>

  <!-- 120Hz 3D Wireframe Superellipsoid Head + Hatched Node Eyes Canvas -->
  <canvas id="face-canvas"></canvas>

  <!-- Ultra-clean monospace corner telemetry (marked.dev / CAD drafting aesthetic) -->
  <header id="hud-top" class="hud-top">
    <div class="hud-left">
      <span id="conn-dot" class="conn-dot"></span>
      <span id="state-pill" class="mono-tag">READY</span>
    </div>
    <div class="hud-right">
      <span id="pose-telemetry" class="mono-dim">Y +00.0° · P +00.0°</span>
      <span id="opt-pill" class="mono-tag hidden">1.0× · 2.7K</span>
      <span id="clock-mini" class="mono-dim">12:00</span>
    </div>
  </header>

  <!-- Mode A: Quiet Focus / Deep Work (minimal hairline clock beneath dimmed wireframe) -->
  <section id="focus-layer" class="focus-layer hidden" aria-hidden="true">
    <div id="focus-clock" class="focus-clock">12:00</div>
    <div class="focus-sub">QUIET MODE · SWIPE UP TO WAKE</div>
  </section>

  <!-- Mode B: Clean Desk Reading Status Strip (full-bleed 3D head looking down, NO raw transcript wall!) -->
  <section id="desk-strip" class="desk-strip hidden" aria-hidden="true">
    <div class="desk-strip-inner">
      <div class="desk-strip-left">
        <span id="desk-led-dot" class="desk-led-dot"></span>
        <span id="desk-status-label" class="desk-strip-title">DESK // SHEET LOCKED</span>
        <span id="desk-optics" class="desk-strip-optics">1.0× · 2.7K</span>
      </div>
      <div class="desk-strip-right">
        <span id="desk-hilight-label" class="desk-strip-meta">HILIGHT // RING</span>
        <button id="btn-desk-to-face" class="chip-btn">FACE ME ↗</button>
      </div>
    </div>
    <div id="desk-scan-bar" class="desk-scan-bar hidden">
      <div class="desk-scan-fill"></div>
    </div>
  </section>

  <!-- Mode C: Full-Bleed Interactive OLED Study Board (Exercise / Checklist / Concept) -->
  <section id="board-layer" class="board-layer hidden" aria-hidden="true">
    <div id="board-card" class="board-card" data-card-mode="exercise">
      <span class="corner tl">+</span>
      <span class="corner tr">+</span>
      <span class="corner bl">+</span>
      <span class="corner br">+</span>

      <div class="board-header">
        <div class="board-title-group">
          <span id="board-mode-badge" class="board-mode-badge">EXERCISE</span>
          <h1 id="board-title" class="board-title">BAC PRACTICE · HEAT TRANSFER</h1>
        </div>
        <div class="board-header-right">
          <span id="board-progress-pill" class="mono-tag hidden">0 / 3</span>
          <button id="btn-close-board" class="icon-close-btn" title="Close board">×</button>
        </div>
      </div>

      <div id="board-progress-track" class="board-progress-track hidden">
        <div id="board-progress-fill" class="board-progress-fill"></div>
      </div>

      <div class="board-divider"></div>

      <div class="board-body">
        <!-- Exercise mode: Given Data pill strip -->
        <div id="board-given" class="board-given hidden">
          <span class="given-tag">GIVEN</span>
          <span id="board-given-text" class="given-text"></span>
        </div>

        <!-- Exercise / Checklist / Concept items -->
        <ul id="board-list" class="board-list"></ul>

        <!-- Exercise collapsible Hint OR Concept/Checklist takeaway note -->
        <div id="board-hint-wrap" class="board-hint-wrap hidden">
          <button id="btn-toggle-hint" class="btn-toggle-hint">HINT ▸ TAP TO REVEAL</button>
          <div id="board-hint-box" class="board-hint-box hidden"></div>
        </div>
        <div id="board-note" class="board-note hidden"></div>
      </div>

      <div class="board-footer">
        <span id="board-foot-guide" class="board-foot-guide">TAP HINT WHEN READY</span>
        <div class="board-foot-actions">
          <button id="btn-board-pivot" class="chip-btn primary">LOOK AT SHEET ↘</button>
          <button id="btn-clear-card" class="chip-btn">CLEAR ×</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Micro toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Discreet preview/demo dock (?demo=1 or bottom-right micro dot) -->
  <button id="btn-demo-toggle" class="btn-demo-toggle" title="States & preview">+</button>
  <aside id="demo-dock" class="demo-dock hidden">
    <button data-demo="live">LIVE</button>
    <button data-demo="focus">QUIET</button>
    <button data-demo="listen">LISTEN</button>
    <button data-demo="attentive">ATTENTIVE</button>
    <button data-demo="think">THINK Δ</button>
    <button data-demo="speak">SPEAK</button>
    <button data-demo="desk">DESK</button>
    <button data-demo="exercise">EXERCISE</button>
    <button data-demo="checklist">TO-DO</button>
    <button data-demo="concept">CONCEPT</button>
    <button data-demo="yes">YES</button>
    <button data-demo="no">NO</button>
    <button id="btn-fs">FULL</button>
  </aside>

  <script src="/static/face.js"></script>
</body>
</html>
