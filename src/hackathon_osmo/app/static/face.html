<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/static/face-manifest.json" />
  <title>Osmo · Pixel OLED Companion</title>
  <link rel="stylesheet" href="/static/face.css" />
</head>
<body data-mode="dialogue">
  <!-- Ambient edge halo mirroring the rear 8-LED HiLight ring -->
  <div id="halo" class="halo"></div>

  <!-- 120Hz OLED Canvas for alive eyes, voice waveform & subtle focus breathing -->
  <canvas id="face-canvas"></canvas>

  <!-- Minimal top status strip (disappears in Focus mode) -->
  <header id="hud-top" class="hud-top">
    <div class="hud-left">
      <span id="conn-dot" class="conn-dot"></span>
      <span id="state-pill" class="state-pill">PRÊT</span>
    </div>
    <div class="hud-right">
      <span id="opt-pill" class="opt-pill hidden">1.0× · 2.7K</span>
      <span id="clock-mini" class="clock-mini">12:00</span>
    </div>
  </header>

  <!-- Mode A: Deep Work / Focus (quiet, non-disturbing ambient presence) -->
  <section id="focus-layer" class="focus-layer hidden" aria-hidden="true">
    <div id="focus-clock" class="focus-clock">12:00</div>
    <div id="focus-sub" class="focus-sub">MODE DISCRET · GLISSEZ VERS LE HAUT POUR RÉVEILLER</div>
  </section>

  <!-- Mode B: Dialogue live caption (fades cleanly after speech) -->
  <div id="caption-wrap" class="caption-wrap hidden">
    <p id="caption-text" class="caption-text"></p>
  </div>

  <!-- Mode C: Desk Reading Contextual HUD (legible at 60-80 cm when angled on notebook) -->
  <section id="desk-layer" class="desk-layer hidden" aria-hidden="true">
    <div class="desk-card">
      <div class="desk-header">
        <div class="desk-badge">
          <span id="desk-led-dot" class="desk-led-dot"></span>
          <span id="desk-status-label">LECTURE FEUILLE</span>
        </div>
        <div id="desk-optics" class="desk-optics">1.0× · 2688×1512</div>
      </div>

      <div id="desk-body" class="desk-body">
        <p id="desk-reply" class="desk-reply">En attente d'analyse de la feuille…</p>
      </div>

      <div class="desk-footer">
        <div id="desk-scan-bar" class="desk-scan-bar hidden">
          <div class="desk-scan-fill"></div>
        </div>
        <div class="desk-hint">Double-tap : retour visage</div>
      </div>
    </div>
  </section>

  <!-- Touch gesture feedback toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Discreet demo / test drawer (visible on ?demo=1 or long-press bottom-right corner) -->
  <button id="btn-demo-toggle" class="btn-demo-toggle" title="Aperçu des états">●</button>
  <aside id="demo-dock" class="demo-dock hidden">
    <button data-demo="live">Live WS</button>
    <button data-demo="focus">Focus</button>
    <button data-demo="listen">Écoute</button>
    <button data-demo="think">Réflexion</button>
    <button data-demo="speak">Parole</button>
    <button data-demo="yes">Oui ^^</button>
    <button data-demo="no">Non</button>
    <button data-demo="curious">Curieux</button>
    <button data-demo="search">Scan</button>
    <button data-demo="desk">Feuille</button>
    <button id="btn-fs">Plein écran</button>
  </aside>

  <script src="/static/face.js"></script>
</body>
</html>
