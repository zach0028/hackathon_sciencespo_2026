<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/static/face-manifest.json" />
  <title>Osmo · CAD Companion OLED</title>
  <link rel="stylesheet" href="/static/face.css" />
</head>
<body data-mode="dialogue">
  <!-- Subtle architectural edge glow mirroring rear 8-LED HiLight ring -->
  <div id="halo" class="halo"></div>

  <!-- 120Hz 3D Wireframe Superellipsoid Head + Hatched Node Eyes Canvas -->
  <canvas id="face-canvas"></canvas>

  <!-- Ultra-clean monospace corner telemetry (marked.dev / CAD drafting aesthetic) -->
  <header id="hud-top" class="hud-top">
    <div class="hud-left">
      <span id="conn-dot" class="conn-dot"></span>
      <span id="state-pill" class="mono-tag">IDLE</span>
    </div>
    <div class="hud-right">
      <span id="pose-telemetry" class="mono-dim">Y +00.0° · P +00.0°</span>
      <span id="opt-pill" class="mono-tag hidden">1.0× · 2.7K</span>
      <span id="clock-mini" class="mono-dim">12:00</span>
    </div>
  </header>

  <!-- Mode A: Quiet Focus / Deep Work (minimal hairline clock beneath dimmed wireframe) -->
  <section id="focus-layer" class="focus-layer hidden" aria-hidden="true">
    <div id="focus-clock" class="focus-clock">12:00</div>
    <div class="focus-sub">QUIET MODE · SWIPE UP TO WAKE</div>
  </section>

  <!-- Mode B: Dialogue live caption (monochrome editorial hairline bar) -->
  <div id="caption-wrap" class="caption-wrap hidden">
    <span class="caption-prefix">OSMO //</span>
    <p id="caption-text" class="caption-text"></p>
  </div>

  <!-- Mode C: Desk Reading Blueprint Card (editorial marked.dev drafting grid) -->
  <section id="desk-layer" class="desk-layer hidden" aria-hidden="true">
    <div class="desk-card">
      <span class="corner tl">+</span>
      <span class="corner tr">+</span>
      <span class="corner bl">+</span>
      <span class="corner br">+</span>

      <div class="desk-header">
        <div class="desk-badge">
          <span id="desk-led-dot" class="desk-led-dot"></span>
          <span id="desk-status-label">DESK // READING</span>
        </div>
        <div id="desk-optics" class="desk-optics">1.0× · 2688×1512</div>
      </div>

      <div class="desk-divider"></div>

      <div class="desk-body">
        <p id="desk-reply" class="desk-reply">Waiting for document analysis…</p>
        <ul id="screen-list" class="screen-list hidden"></ul>
        <div id="screen-note" class="screen-note hidden"></div>
      </div>

      <div class="desk-footer">
        <div id="desk-scan-bar" class="desk-scan-bar hidden">
          <div class="desk-scan-fill"></div>
        </div>
        <div class="desk-meta-row">
          <span id="desk-hilight-label">HILIGHT // RING-LIGHT</span>
          <button id="btn-clear-card" class="btn-clear-card hidden">CLEAR ×</button>
          <span id="desk-hint-right">DOUBLE-TAP : FACE</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Micro toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Discreet preview/demo dock (?demo=1 or bottom-right micro dot) -->
  <button id="btn-demo-toggle" class="btn-demo-toggle" title="États & aperçu">+</button>
  <aside id="demo-dock" class="demo-dock hidden">
    <button data-demo="live">LIVE</button>
    <button data-demo="focus">QUIET</button>
    <button data-demo="drowsy">DROWSY</button>
    <button data-demo="listen">LISTEN</button>
    <button data-demo="attentive">ATTENTIVE</button>
    <button data-demo="barge_in">BARGE-IN</button>
    <button data-demo="think">THINK Δ</button>
    <button data-demo="intent_desk">INTENT</button>
    <button data-demo="focusing">AF SQUINT</button>
    <button data-demo="reading">READING</button>
    <button data-demo="speak">SPEAK</button>
    <button data-demo="greet">GREET</button>
    <button data-demo="yes">YES</button>
    <button data-demo="no">NO</button>
    <button data-demo="curious">CURIOUS</button>
    <button data-demo="search">SCAN</button>
    <button data-demo="desk">DESK</button>
    <button data-demo="checklist">TO-DO</button>
    <button id="btn-fs">FULL</button>
  </aside>

  <script src="/static/face.js"></script>
</body>
</html>
