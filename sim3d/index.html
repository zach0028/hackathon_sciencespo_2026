<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSMO // ELEGNT 3D Studio</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="theme-light">
  <div id="viewport"></div>

  <button id="btn-unhide" class="floating-unhide" title="Réafficher l'interface (H)">Afficher UI (H)</button>

  <div id="hud" class="hud">
    <!-- MINIMAL TOP BAR -->
    <header class="topbar">
      <div class="glass-pill brand-pill">
        <span class="status-dot" id="brand-dot"></span>
        <span class="brand-name">OSMO</span>
        <span class="sep"></span>
        <span class="brand-caption" id="lbl-log">Lampe HiLight 2900K · Glisse le cahier ou clique sur une page</span>
      </div>

      <div class="top-right">
        <div class="glass-pill mood-pill" role="group" aria-label="Ambiance lumineuse">
          <button class="pill-btn active" data-mood="day">Jour</button>
          <button class="pill-btn" data-mood="golden">Soirée</button>
          <button class="pill-btn" data-mood="night">Nuit</button>
        </div>

        <button id="btn-drawer" class="glass-pill icon-pill" title="Contrôles avancés & Télémétrie (S)">
          <span>Studio</span>
          <span class="gear">⚙</span>
        </button>
      </div>
    </header>

    <!-- COLLAPSIBLE ADVANCED STUDIO DRAWER (CLOSED BY DEFAULT) -->
    <aside id="studio-drawer" class="drawer" aria-hidden="true">
      <div class="drawer-sec">
        <div class="drawer-head"><span>Caméras (1–5)</span></div>
        <div class="grid-5">
          <button class="chip active" data-cam="hero">Hero</button>
          <button class="chip" data-cam="lamp">Lampe</button>
          <button class="chip" data-cam="pov">POV</button>
          <button class="chip" data-cam="rear">Optiques</button>
          <button class="chip" data-cam="top">Top</button>
        </div>
      </div>

      <div class="drawer-sec">
        <div class="drawer-head">
          <span>Expressivité</span>
          <button id="btn-follow-hands" class="mini-tag on">Suivi Main : ON</button>
        </div>
        <div class="grid-3">
          <button class="chip" data-exp="focus">Focus</button>
          <button class="chip active" data-exp="companion">Companion</button>
          <button class="chip" data-exp="playful">Playful</button>
        </div>
      </div>

      <div class="drawer-sec">
        <div class="drawer-head"><span>Micro-Réactions</span></div>
        <div class="grid-4">
          <button class="chip" data-react="nod_yes">Oui</button>
          <button class="chip" data-react="curious">Curieux</button>
          <button class="chip" data-react="doubt">Doute</button>
          <button class="chip" data-react="celebrate">Bravo</button>
          <button class="chip" data-react="lean_in">Pencher</button>
          <button class="chip" data-react="recoil">Recul</button>
          <button id="btn-sc-nudge" class="chip span-2">Nudge discret</button>
        </div>
      </div>

      <div class="drawer-sec">
        <div class="drawer-head"><span>Écran OLED Pixel</span></div>
        <div class="grid-3">
          <button class="chip active" data-board="none">Visage</button>
          <button class="chip" data-board="definition">Définition</button>
          <button class="chip" data-board="exercise">Exercice</button>
          <button class="chip" data-board="exam">Mini-Exam</button>
          <button class="chip" data-board="feedback">Correction</button>
          <button class="chip" data-board="checklist">Plan</button>
        </div>
      </div>

      <div class="drawer-sec">
        <div class="drawer-head">
          <span>DJI OM3 · Télémétrie</span>
          <span id="t-torque" class="mono-val">16% · SAFE</span>
        </div>
        <div class="torque-bar"><div id="t-torque-fill" class="torque-fill"></div></div>
        <div class="telem-row">
          <span>PAN <b id="t-pan">0.0°</b></span>
          <span>PITCH <b id="t-pitch">+6.0°</b></span>
          <span>FPS <b id="t-fps">60</b></span>
        </div>
      </div>

      <div class="drawer-foot">
        <button id="btn-sound" class="chip active">Son : ON</button>
        <button id="btn-bridge" class="chip">Sync Live : OFF</button>
        <button id="btn-hide" class="chip">Masquer (H)</button>
      </div>
    </aside>

    <!-- SINGLE MINIMAL FLOATING BOTTOM DOCK -->
    <div class="bottom-dock-wrap">
      <!-- Contextual Warm Lamp Tint Micro-Pill (visible only when Lamp is active) -->
      <div id="lamp-subbar" class="glass-pill lamp-subbar visible">
        <button class="swatch-btn active" data-lamp="warm"><span class="sw sw-warm"></span>2900K</button>
        <button class="swatch-btn" data-lamp="study"><span class="sw sw-study"></span>Study</button>
        <button class="swatch-btn" data-lamp="cozy"><span class="sw sw-cozy"></span>Cozy</button>
        <button class="swatch-btn" data-lamp="sunset"><span class="sw sw-sunset"></span>Sunset</button>
      </div>

      <!-- 6 Core ELEGNT Actions -->
      <nav class="glass-pill main-dock" aria-label="Scénarios ELEGNT">
        <button id="btn-dock-lamp" class="dock-btn warm-on">☀ Lampe</button>
        <button id="btn-sc-showtell" class="dock-btn">▶ Show &amp; Tell</button>
        <button id="btn-sc-triadic" class="dock-btn">◈ Réflexion</button>
        <button id="btn-sc-social" class="dock-btn">◎ Social</button>
        <button id="btn-sc-music" class="dock-btn">♪ Musique</button>
        <span class="dock-sep"></span>
        <button id="btn-style-toggle" class="dock-btn active" title="Comparer ELEGNT Expressif vs Robotique Linéaire">✦ ELEGNT</button>
      </nav>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
